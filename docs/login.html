<script>
  // T231 防闪烁：CSS 加载前同步应用深色主题 class（默认跟随系统）
  (function () {
    try {
      var t = localStorage.getItem('workflowos_theme');
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('theme-dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>

  <style>
    /* ── 登录页专属样式 ── */
    /* 签名元素：顶部红色色带 + 党徽 + 标题，构建仪式感 */
    .login-hero {
      background: linear-gradient(180deg, #7A0010 0%, #9B0000 100%);
      position: relative;
      overflow: hidden;
    }
    .login-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 50% 0%, rgba(212,175,55,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .login-hero-emblem {
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15));
    }
    /* 卡片入场动画 */
    @keyframes loginFadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-card-anim {
      animation: loginFadeUp 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    .login-card-anim-delay-1 { animation-delay: 0.05s; }
    .login-card-anim-delay-2 { animation-delay: 0.12s; }
    /* 表单输入 */
    .login-input {
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .login-input:focus {
      border-color: #CE1126;
      box-shadow: 0 0 0 3px rgba(206,17,38,0.12);
    }
    /* 登录按钮 */
    .login-btn {
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    .login-btn:hover {
      box-shadow: 0 2px 8px rgba(122,0,16,0.18);
    }
    .login-btn:active {
      transform: scale(0.98);
    }
    /* 开发模式卡片 */
    .login-card { transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s; }
    .login-card:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      transform: translateY(-1px);
      border-color: #FECACA;
    }
    .dev-mode-section { display: none; }
    .dev-mode-section.visible { display: block; }
    /* 分隔条 */
    .login-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #E5E7EB, transparent);
    }
    /* 偏好减少动画 */
    @media (prefers-reduced-motion: reduce) {
      .login-card-anim, .login-card-anim-delay-1, .login-card-anim-delay-2 {
        animation: none !important;
      }
      .login-btn, .login-card, .login-input { transition: none !important; }
    }
  </style>
</head>
<body class="bg-surface-page min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- 顶部签名区：红色色带 + 党徽 + 标题 -->
    <div class="login-hero login-card-anim rounded-t-2xl px-6 py-8 text-center">
      <img src="./assets/images/party_emblem.png" alt="党徽" class="login-hero-emblem mx-auto mb-3" style="width:56px;height:56px;" draggable="false">
      <h1 class="font-title text-lg font-bold text-white mb-1 tracking-wide">光华管理学院本科生党支部</h1>
      <p class="text-xs font-light text-party-100" style="color:rgba(255,255,255,0.78);">管理引擎</p>
    </div>

    <!-- 默认模式: 账号密码登录 -->
    <div id="login-default" class="login-card-anim login-card-anim-delay-1 bg-white rounded-b-2xl shadow-sm border border-t-0 border-gray-200 p-6">
      <h2 class="font-title text-base font-semibold text-gray-800 mb-1">登录</h2>
      <p class="text-xs text-gray-400 mb-5">请使用学号和密码登录</p>
      <form id="login-form" class="space-y-4" novalidate>
        <div>
          <label for="student-id" class="block text-xs font-medium text-gray-600 mb-1.5">学号</label>
          <input type="text" id="student-id" class="login-input w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none" placeholder="请输入学号" autocomplete="username">
        </div>
        <div>
          <label for="password" class="block text-xs font-medium text-gray-600 mb-1.5">密码</label>
          <input type="password" id="password" class="login-input w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <p id="login-error" class="text-xs text-red-600 hidden">学号或密码错误，请重试</p>
        <button type="submit" class="login-btn w-full text-sm px-4 py-[7px] rounded-lg bg-party-700 text-white font-medium hover:bg-party-800">登录</button>
      </form>
      <div class="login-divider my-5"></div>
      <p class="text-center text-xs text-gray-400">Mock 校验 · 开发阶段</p>
    </div>

    <!-- 开发模式: 身份卡片网格 -->
    <div id="login-dev" class="dev-mode-section login-card-anim login-card-anim-delay-1 bg-white rounded-b-2xl shadow-sm border border-t-0 border-gray-200 p-6">
      <h2 class="font-title text-base font-semibold text-gray-800 mb-1">开发模式 · 选择身份</h2>
      <p class="text-xs text-gray-400 mb-5">直接选择身份登录，仅本地开发使用</p>
      <div class="grid grid-cols-2 gap-3" id="dev-cards">
        <!-- 7 张卡片由 JS 动态生成 -->
      </div>
    </div>

    <!-- 开发模式开关 -->
    <div class="login-card-anim login-card-anim-delay-2 text-center mt-4">
      <label class="inline-flex items-center gap-2 text-xs text-gray-400 cursor-pointer select-none">
        <input type="checkbox" id="dev-toggle" class="rounded">
        开发模式
      </label>
    </div>
  </div>

  <script type="module" src="./src/entries/login-entry.js?v=20260807g"></script>
</body>
</html>
