# ════════════════════════════════════════════════════════════════
#  deploy/nginx.sample.conf —— 反向代理示例（放在 /etc/nginx/conf.d/ 下改名 .conf 即可）
#
#  两条硬要求（来自《部署与对外对接》A.2 第 10 / 11 条，⚠ 漏一条就会出「看起来能跑、其实错」的故障）：
#   ① `client_max_body_size` 必须 **≥ 10m**（等于后端上传上限，见 server/routes/uploads.js 的 MAX_SIZE）。
#     低于它时大图在**代理层**就被拦下（413 / 连接中断），与后端 413 是两层不同的失败。
#   ② `location = /src/config/deploy.js` **必须单独放行到 Node**——该文件是 Node **动态注入**路由
#      （server/app.js），不是磁盘上的静态文件；若被静态托管走，会返回磁盘版 DEPLOY_MODE='static'
#     ⇒ **「关于」门面与部署形态判定会错**。
#
#  两种形态：**方案 A 全量代理**（简单、推荐）· **方案 B nginx 托管静态**（省 Node 带宽，但必须带上②）
# ════════════════════════════════════════════════════════════════

# ── 方案 A（默认，最简单）：所有请求都交给 Node ──────────────────
server {
    listen 80;
    server_name gsm1921.example.edu.cn;      # ← 改成你的域名

    client_max_body_size 10m;                 # ← 硬要求①：≥ 上传上限

    location / {
        proxy_pass http://127.0.0.1:3000;      # ← 与 PORT 环境变量一致
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # 注意：方案 A 下 `/src/config/deploy.js` 天然走 Node ⇒ 硬要求②自动满足
}

# ── 方案 B（可选）：nginx 直接托管 docs/ 静态资源，只把 /api 与那一个文件交给 Node ──
#   启用时请注释掉方案 A 的 location /，改用下面两段（**顺序不能反**：精确匹配优先）：
#
