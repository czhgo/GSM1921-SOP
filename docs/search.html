<body>
<a href="#main-content" class="visually-hidden skip-link">跳到主要内容</a>

<header id="app-header"></header>
<div id="sidebar-overlay"></div>
<aside id="app-sidebar" class="sidebar-collapsed"></aside>

<div class="sidebar-main-content pt-16 min-h-screen">
  <main id="main-content" class="flex-1 px-4 py-6 md:px-8 overflow-y-auto min-w-0">
    <div class="max-w-6xl mx-auto">

      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="font-title-cn text-xl font-bold text-gray-800">参考资料</h2>
        </div>
        <a href="./index.html" class="text-xs text-accent flex items-center gap-1">← 返回主页</a>
      </div>
      <!-- P3 四段：检索（本页只有关键词，其余段为空段，不输出空行） -->
      <div class="lf-bar mb-4">
        <div class="lf-bar__row" data-seg="search">
          <label for="ref-search-input" class="sr-only">搜索资料</label>
          <input type="search" id="ref-search-input" class="input-flat text-xs lf-kw" placeholder="搜索资料..." autocomplete="off">
        </div>
      </div>

      <div class="flex items-center justify-between mb-4">
        <h3 class="font-title-cn text-base font-semibold text-gray-800">官方文件</h3>
        <span id="ref-result-count" class="text-xs text-gray-500"></span>
      </div>
      <div id="ref-docs-list" class="space-y-3"></div>
      <div id="ref-docs-empty" class="hidden"><div class="empty-state"><p class="empty-state__text">未找到匹配的资料</p></div></div>

      <div class="flex items-center justify-between mb-4 mt-8">
        <h3 class="font-title-cn text-base font-semibold text-gray-800">支部文件</h3>
        <button id="ref-branch-doc-add-btn" class="ref-add-btn hidden">写入文件</button>
      </div>
      <div id="ref-branch-docs-list" class="space-y-3"></div>
      <div id="ref-branch-docs-empty" class="hidden"><div class="empty-state"><p class="empty-state__text">暂无支部文件</p></div></div>
      <div id="ref-branch-docs-login-hint" class="hidden"><div class="empty-state"><p class="empty-state__text">请先登录后使用</p></div></div>

      <div class="flex items-center justify-between mb-4 mt-8">
        <h3 class="font-title-cn text-base font-semibold text-gray-800">常用入口</h3>
      </div>
      <div id="ref-sites-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    </div>
  </main>
</div>
