<head>

<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 — GSM1921-SOP</title>
  <meta name="description" content="GSM1921-SOP —— 党支部工作系统（开源模板，每个支部可部署自己的实例）">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>

<body>
<a href="#main-content" class="visually-hidden skip-link">跳到主要内容</a>

<header id="app-header"></header>

<div id="sidebar-overlay"></div>

<aside id="app-sidebar" class="sidebar-collapsed"></aside>

<div class="sidebar-main-content pt-16 min-h-screen">
  <main id="main-content" class="flex-1 px-4 py-6 md:px-8 overflow-y-auto min-w-0">
    <section id="view-dashboard" class="view-section" aria-labelledby="dashboard-hero-title">
      <div class="max-w-6xl mx-auto">
        <!-- 2026-10-19 支书裁定：恢复首页抬头式品牌块（党徽 + 工作台标题），不再只依赖顶栏 H1。
             标题文案由 main-entry.js 按登录态写入 getHeaderTitle()，HTML 不写死示例支部名。 -->
        <div class="text-center mb-6" id="dashboard-hero">
          <img src="./assets/images/party_emblem.png" alt="党徽" class="dashboard-hero__emblem mx-auto mb-3" draggable="false">
          <h2 id="dashboard-hero-title" class="font-title-cn text-2xl font-bold text-gray-800 mb-1">党支部工作台</h2>
        </div>
        <div id="dashboard-stats" class="stat-grid mb-4"></div>
        <div class="card rounded-xl p-5 mb-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="font-title-cn text-base font-semibold text-gray-800">重要通知</h2>
          </div>
          <div id="dashboard-notice-list" class="text-sm text-gray-500"><p>加载中…</p></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div class="card rounded-xl p-5">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-title-cn text-base font-semibold text-gray-800">近期活动</h2>
              <div class="flex items-center gap-3">
                <div id="activity-view-tabs" class="flex items-center gap-2">
                  <button class="activity-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors duration-200 bg-[var(--app-accent-soft-bg)] border-[var(--app-accent)] text-[var(--app-accent-soft-text)]" data-view="calendar">日历</button>
                  <button class="activity-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors duration-200 bg-white border-[var(--neutral-200)] text-gray-600 hover:bg-surface-hover" data-view="list">列表</button>
                </div>
                <a href="./workspace/visitor.html" class="text-xs text-accent">工作台 →</a>
                <!-- 按角色落真实存在的页签（data-ws-tab-<page>）；日历视图参数名用 subview（view 会被工作台壳消费）。
                     2026-10-25 IA 62→45：org/prop/disc/leader 的「活动日历」页签已降为「工作概况」页内折叠卡
                     ⇒ 落 `?tab=overview&section=calendar`（data-ws-section-<page>）；支书台仍是活动管理。 -->
                <a href="./workspace/visitor.html"
                   data-ws-tab="calendar"
                   data-ws-tab-org="overview"
                   data-ws-section-org="calendar"
                   data-ws-tab-prop="overview"
                   data-ws-section-prop="calendar"
                   data-ws-tab-disc="overview"
                   data-ws-section-disc="calendar"
                   data-ws-tab-leader="overview"
                   data-ws-section-leader="calendar"
                   data-ws-tab-visitor="activities"
                   data-ws-tab-party-committee="branches"
                   data-ws-view="calendar"
                   class="text-xs text-accent">完整日历 →</a>
              </div>
            </div>
            <div id="activity-calendar-view">
              <div class="mb-3">
                <select id="month-selector" class="input-flat text-xs" style="min-width:120px;"></select>
              </div>
              <div id="cal-main-empty" class="hidden"><div class="empty-state"><p class="empty-state__text">本月暂无活动</p></div></div>
              <!-- U3（2026-09-07）：日历网格 JS 填充前预置等高骨架（min-height 由骨架占位）——数据到达整块填充不再从 0 高弹出 -->
              <div id="cal-main-grid">
                <div data-cal-skeleton style="min-height:340px;display:flex;flex-direction:column;gap:8px;">
                  <div class="flex gap-2">
                    <div class="flex-1 h-3 rounded bg-gray-100 animate-pulse"></div>
                    <div class="flex-1 h-3 rounded bg-gray-100 animate-pulse"></div>
                    <div class="flex-1 h-3 rounded bg-gray-100 animate-pulse"></div>
                    <div class="flex-1 h-3 rounded bg-gray-100 animate-pulse"></div>
                    <div class="flex-1 h-3 rounded bg-gray-100 animate-pulse"></div>
                    <div class="flex-1 h-3 rounded bg-gray-100 animate-pulse"></div>
                    <div class="flex-1 h-3 rounded bg-gray-100 animate-pulse"></div>
                  </div>
                  <div class="flex-1 rounded-lg bg-gray-100 animate-pulse"></div>
                  <div class="flex-1 rounded-lg bg-gray-100 animate-pulse"></div>
                  <div class="flex-1 rounded-lg bg-gray-100 animate-pulse"></div>
                  <div class="flex-1 rounded-lg bg-gray-100 animate-pulse"></div>
                  <div class="flex-1 rounded-lg bg-gray-100 animate-pulse"></div>
                </div>
              </div>
              <div id="calendar-legend" class="mt-3">
                <div id="legend-items" class="flex flex-wrap gap-3 text-xs text-gray-500"></div>
              </div>
            </div>
            <div id="activity-list-view" class="hidden">
              <div id="dashboard-activity-list" class="text-sm text-gray-500"></div>
            </div>
          </div>
          <!-- 首页工作组进展：活动工作组 / 专班工作组两类分组；数据口径见 components/dashboard/taskforce-list.js -->
          <div class="card rounded-xl p-5" id="dashboard-taskforce-card">
            <div class="mb-4">
              <h2 class="font-title-cn text-base font-semibold text-gray-800">工作组进展</h2>
            </div>
            <div id="dashboard-taskforce-list" class="text-sm text-gray-500"></div>
          </div>
        </div>
        <!-- 活动风采 -->
        <div class="card rounded-xl p-5 mt-6 card--static" id="dashboard-gallery-card">
          <div class="flex items-center justify-between mb-4">
            <h2 class="font-title-cn text-base font-semibold text-gray-800">活动风采</h2>
            <a href="./archive.html" class="text-xs text-accent">归档库 →</a>
          </div>
          <div id="dashboard-gallery" class="text-sm text-gray-500"></div>
        </div>
      </div>
    </section>
  </main>
</div>
