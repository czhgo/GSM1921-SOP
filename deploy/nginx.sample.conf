# ── HTTPS（对外必开：登录 token 在头里明文传输）────────────────
# 证书可用 certbot 自动签发：
#   certbot --nginx -d gsm1921.example.edu.cn
# 或者内网自签 + 让浏览器信任。签发后建议再加：
#   add_header Strict-Transport-Security "max-age=31536000" always;
