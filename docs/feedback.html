<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光华管理学院本科生党支部管理引擎</title>
  <meta name="description" content="意见反馈 — SOP 优化与规则补丁提案">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            party: { DEFAULT:'#CE1126', red:'#CE1126', gold:'#D4AF37', 'gold-light':'#F5DEB3', 50:'#FEF2F2', 100:'#FEE2E2', 200:'#FECACA', 300:'#FCA5A5', 400:'#F87171', 500:'#EF4444', 600:'#DC2626', 700:'#CE1126', 800:'#9B0000', 900:'#7A0010', 950:'#4A000A' },
            primary: { 50:'#FEF2F2', 100:'#FEE2E2', 200:'#FECACA', 300:'#FCA5A5', 400:'#F87171', 500:'#EF4444', 600:'#DC2626', 700:'#CE1126', 800:'#9B0000', 900:'#7A0010', 950:'#4A000A' },
            accent: { gold:'#D4AF37', 'gold-light':'#F5DEB3', amber:'#D97706', blue:'#3B82F6', emerald:'#10B981', violet:'#8B5CF6' },
            neutral: { 0:'#FFFFFF', 50:'#F8F9FA', 100:'#F3F4F6', 200:'#E5E7EB', 300:'#D1D5DB', 400:'#9CA3AF', 500:'#6B7280', 600:'#4B5563', 700:'#374151', 800:'#1F2937', 900:'#111827' },
            surface: { page:'#F8F9FA', card:'#FFFFFF', elevated:'#FFFFFF', header:'#7A0010', sidebar:'#FFFFFF', hover:'#F3F4F6', active:'#FEE2E2' },
          },
          fontFamily: { sans:['Noto Sans SC','-apple-system','PingFang SC','Microsoft YaHei','sans-serif'], serif:['Noto Serif SC','STKaiti','KaiTi','serif'], title:['STZhongsong','华文中宋','STSong','SimSun','serif'], 'title-en':['Times New Roman','Georgia','serif'] },
        },
      }
    };
  </script>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>

<header id="app-header"></header>
<div id="sidebar-overlay"></div>
<aside id="app-sidebar" class="sidebar-collapsed"></aside>

<div class="sidebar-main-content pt-16 min-h-screen">
  <main class="flex-1 px-4 py-6 md:px-8 overflow-y-auto min-w-0">
    <div class="max-w-3xl mx-auto">

      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="font-title-cn text-xl font-bold text-gray-800">意见反馈</h2>
          <p class="text-xs text-gray-500 mt-1">SOP 优化与规则补丁提案 — 拒绝形式主义，只写"哪里卡壳"和"期望怎么改"</p>
        </div>
        <a href="./index.html" class="text-xs text-blue-600 hover:text-blue-800 flex items-center gap-1">← 返回主页</a>
      </div>

      <div class="card rounded-2xl p-6 mb-6">
        <h3 class="font-title-cn text-base font-bold text-gray-800 mb-5">SOP 优化提案反馈卡</h3>

        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-2">1. 影响范围 (Scope)</label>
          <div class="space-y-2" id="scope-options">
            <label class="flex items-center gap-2 p-3 rounded-lg border border-gray-200 cursor-pointer hover:bg-gray-50 transition-colors has-[:checked]:bg-red-50 has-[:checked]:border-red-300">
              <input type="radio" name="scope" value="permanent" class="sr-only peer">
              <span class="w-4 h-4 rounded-full border-2 border-gray-300 peer-checked:border-red-600 peer-checked:bg-red-600 flex items-center justify-center"><span class="w-2 h-2 rounded-full bg-white hidden peer-checked:block"></span></span>
              <span class="text-sm text-gray-700">底层架构与原则建议（Permanent）</span>
            </label>
            <label class="flex items-center gap-2 p-3 rounded-lg border border-gray-200 cursor-pointer hover:bg-gray-50 transition-colors has-[:checked]:bg-red-50 has-[:checked]:border-red-300">
              <input type="radio" name="scope" value="global" class="sr-only peer">
              <span class="w-4 h-4 rounded-full border-2 border-gray-300 peer-checked:border-red-600 peer-checked:bg-red-600 flex items-center justify-center"><span class="w-2 h-2 rounded-full bg-white hidden peer-checked:block"></span></span>
              <span class="text-sm text-gray-700">全局通用业务规则（Global）</span>
            </label>
            <label class="flex items-center gap-2 p-3 rounded-lg border border-gray-200 cursor-pointer hover:bg-gray-50 transition-colors has-[:checked]:bg-red-50 has-[:checked]:border-red-300">
              <input type="radio" name="scope" value="role" class="sr-only peer">
              <span class="w-4 h-4 rounded-full border-2 border-gray-300 peer-checked:border-red-600 peer-checked:bg-red-600 flex items-center justify-center"><span class="w-2 h-2 rounded-full bg-white hidden peer-checked:block"></span></span>
              <span class="text-sm text-gray-700">支委分工与权责调整（Role）</span>
            </label>
            <label class="flex items-center gap-2 p-3 rounded-lg border border-gray-200 cursor-pointer hover:bg-gray-50 transition-colors has-[:checked]:bg-red-50 has-[:checked]:border-red-300">
              <input type="radio" name="scope" value="scenario" class="sr-only peer">
              <span class="w-4 h-4 rounded-full border-2 border-gray-300 peer-checked:border-red-600 peer-checked:bg-red-600 flex items-center justify-center"><span class="w-2 h-2 rounded-full bg-white hidden peer-checked:block"></span></span>
              <span class="text-sm text-gray-700">特定业务场景专用（Scenario-Specific）</span>
            </label>
          </div>
          <div id="scenario-name-wrapper" class="mt-2 hidden">
            <input type="text" id="scenario-name-input" class="input-flat w-full" placeholder="场景名称/编号（如：主题党日-红色1+1共建）">
          </div>
        </div>

        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-2">2. 现场痛点与卡壳环节 (Pain Point)</label>
          <input type="text" id="pain-point-input" class="input-flat w-full mb-2" placeholder="卡壳的 SOP 文件与步骤（如：常见场景指南，党小组主题党日活动第3步）">
          <textarea id="pain-point-detail" class="input-flat w-full" rows="2" placeholder="实际执行困难（一句话说明原流程为何反直觉或不可行）"></textarea>
        </div>

        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-2">3. 期望的规则更改 (Proposed Fix)</label>
          <textarea id="proposed-fix-input" class="input-flat w-full" rows="3" placeholder="直接给出新的规则逻辑，无需在意公文措辞。如：非品牌主题党日活动允许微信群口头报备，免去填表。"></textarea>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">提交人（选填）</label>
          <input type="text" id="submitter-input" class="input-flat w-full" placeholder="姓名（可留空，默认匿名）">
        </div>

        <div class="flex items-center gap-3">
          <button id="btn-submit-feedback" class="btn-primary px-8 py-2.5 font-title-cn">提交反馈</button>
          <span id="feedback-submit-msg" class="text-sm text-green-600 hidden">提交成功！感谢你的反馈。</span>
        </div>
      </div>

      <div class="flex items-center gap-2 mb-4 flex-wrap">
        <button id="btn-export-md" class="px-4 py-2 text-sm rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 transition-colors">导出 Markdown</button>
        <button id="btn-export-json" class="px-4 py-2 text-sm rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 transition-colors">导出 JSON</button>
        <label class="px-4 py-2 text-sm rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 transition-colors cursor-pointer">
          导入 JSON
          <input type="file" id="btn-import-json" accept=".json" class="hidden">
        </label>
      </div>

      <div id="recent-feedback-section" class="card rounded-2xl p-6">
        <h3 class="font-title-cn text-base font-bold text-gray-800 mb-4">近期反馈一览</h3>
        <div id="recent-feedback-list" class="space-y-3">
          <p class="text-sm text-gray-400 text-center py-8">暂无反馈记录。欢迎提交第一条意见！</p>
        </div>
      </div>

    </div>
  </main>
</div>


<script type="module" src="./src/entries/feedback-entry.js"></script>
</body>
</html>
