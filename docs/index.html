<!DOCTYPE html>
<!-- role: [人机] -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光华管理学院本科生党支部管理引擎</title>
  <meta name="description" content="光华管理学院本科生党支部管理引擎">

  <link rel="preload" href="https://fonts.gstatic.com/s/notosanssc/v36/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYxNbPzS5HE.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/notoserifsc/v22/H4coBXePl9DZ0Xe7gG9cyOj7Fq62bGQDs4pX.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            party: { DEFAULT:'#CE1126', red:'#CE1126', gold:'#D4AF37', 'gold-light':'#F5DEB3', 50:'#FEF2F2', 100:'#FEE2E2', 200:'#FECACA', 300:'#FCA5A5', 400:'#F87171', 500:'#EF4444', 600:'#DC2626', 700:'#CE1126', 800:'#9B0000', 900:'#7A0010', 950:'#4A000A' },
            primary: { 50:'#FEF2F2', 100:'#FEE2E2', 200:'#FECACA', 300:'#FCA5A5', 400:'#F87171', 500:'#EF4444', 600:'#DC2626', 700:'#CE1126', 800:'#9B0000', 900:'#7A0010', 950:'#4A000A' },
            accent: { gold:'#D4AF37', 'gold-light':'#F5DEB3', amber:'#D97706', blue:'#3B82F6', emerald:'#10B981', violet:'#8B5CF6' },
            neutral: { 0:'#FFFFFF', 50:'#F8F9FA', 100:'#F3F4F6', 200:'#E5E7EB', 300:'#D1D5DB', 400:'#9CA3AF', 500:'#6B7280', 600:'#4B5563', 700:'#374151', 800:'#1F2937', 900:'#111827' },
            surface: { page:'#F8F9FA', card:'#FFFFFF', elevated:'#FFFFFF', header:'#7A0010', sidebar:'#FFFFFF', hover:'#F3F4F6', active:'#FEE2E2' },
          },
          fontFamily: { sans:['Noto Sans SC','-apple-system','PingFang SC','Microsoft YaHei','sans-serif'], serif:['Noto Serif SC','STKaiti','KaiTi','serif'], title:['STZhongsong','华文中宋','Noto Serif SC','STSong','SimSun','serif'], 'title-en':['Times New Roman','Georgia','serif'] },
          animation: { 'fade-in':'fadeIn 0.4s ease-out forwards', 'slide-up':'slideUp 0.4s ease-out forwards', 'slide-right':'slideRight 0.2s ease-out forwards', 'pulse-soft':'pulseSoft 2s ease-in-out infinite' },
          keyframes: { fadeIn:{'0%':{opacity:'0'},'100%':{opacity:'1'}}, slideUp:{'0%':{opacity:'0',transform:'translateY(16px)'},'100%':{opacity:'1',transform:'translateY(0)'}}, slideRight:{'0%':{transform:'translateX(-100%)'},'100%':{transform:'translateX(0)'}}, pulseSoft:{'0%, 100%':{opacity:'1'},'50%':{opacity:'0.6'}} },
        },
      }
    };
  </script>

  <link rel="stylesheet" href="./src/styles.css">
</head>

<body>

<header id="app-header"></header>

<div id="sidebar-overlay"></div>

<aside id="app-sidebar" class="sidebar-collapsed"></aside>

<div class="sidebar-main-content pt-16 min-h-screen">
  <main class="flex-1 px-4 py-6 md:px-8 overflow-y-auto min-w-0">
    <section id="view-dashboard" class="view-section">
      <div class="max-w-6xl mx-auto">
        <div class="text-center mb-8">
          <img src="./assets/images/party_emblem.png" alt="党徽" class="mx-auto mb-3" style="width:48px;height:48px;" draggable="false">
          <h2 class="font-title-cn text-2xl font-bold text-gray-800 mb-1">光华管理学院本科生党支部管理引擎</h2>
        </div>
        <div id="dashboard-stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>
        <div class="card rounded-2xl p-6 mb-6">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-title-cn text-base font-semibold text-gray-800">重要通知</h3>
            <span id="dashboard-notice-count" class="text-xs text-gray-400"></span>
          </div>
          <div id="dashboard-notice-list" class="text-sm text-gray-500"><p>暂无通知</p></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div class="card rounded-2xl p-6">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-title-cn text-base font-semibold text-gray-800">近期活动</h3>
              <a href="./workspace/visitor.html" class="text-xs text-blue-600 hover:text-blue-800">查看全部 →</a>
            </div>
            <div id="dashboard-activity-list" class="text-sm text-gray-500"><p>暂无活动</p></div>
          </div>
          <div class="card rounded-2xl p-6">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-title-cn text-base font-semibold text-gray-800">专班进展</h3>
              <a href="./workspace/org.html" class="text-xs text-blue-600 hover:text-blue-800">查看全部 →</a>
            </div>
            <div id="dashboard-taskforce-list" class="text-sm text-gray-500"><p>暂无专班信息</p></div>
          </div>
        </div>
        <div class="card rounded-2xl p-6">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-title-cn text-base font-semibold text-gray-800">考勤概况</h3>
            <a href="./workspace/disc.html?mode=readonly" class="text-xs text-blue-600 hover:text-blue-800">查看详情 →</a>
          </div>
          <div id="dashboard-attendance-summary" class="text-sm text-gray-500"><p>暂无考勤数据</p></div>
        </div>
        <!-- 活动风采 -->
        <div class="card rounded-2xl p-6 mt-6">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-title-cn text-base font-semibold text-gray-800">活动风采</h3>
            <a href="./archive.html" class="text-xs text-blue-600 hover:text-blue-800">归档库 →</a>
          </div>
          <div id="dashboard-gallery" class="text-sm text-gray-500"><p>暂无风采展示</p></div>
        </div>
      </div>
    </section>
  </main>
</div>



<script type="module" src="./src/entries/main-entry.js"></script>

</body>
</html>
