<!DOCTYPE html>
<!-- role: [用户]+[工程师]+[AI] -->
<html lang="zh-CN">
<head>
  
<script src="./src/theme-init.js?v=20261028d"></script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — GSM1921-SOP</title>
  <meta name="description" content="登录">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="./src/tailwind-config.js?v=20261028d"></script>
  <link rel="stylesheet" href="./src/styles.css?v=20261028d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    /* ── 登录页专属样式 ── */
    /* 签名元素：顶部红色色带 + 党徽 + 标题，构建仪式感 */
    .login-hero {
      background: linear-gradient(180deg, #7A0010 0%, #9B0000 100%);
      position: relative;
      overflow: hidden;
    }
    .login-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 50% 0%, rgba(212,175,55,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .login-hero-emblem {
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15));
    }
    /* 卡片入场动画 */
    @keyframes loginFadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-card-anim {
      animation: loginFadeUp 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    .login-card-anim-delay-1 { animation-delay: 0.05s; }
    .login-card-anim-delay-2 { animation-delay: 0.12s; }
    /* 表单输入与按钮统一走 styles.css 的 .input-flat / .btn-accent / .btn-outline
       （2026-10-28 支书裁定「控件入族」）：此处不再写登录页专属输入框 / 按钮外观，
       按压反馈由全站唯一源 --press-shadow 承担（不做位移、不用 filter）。 */
    /* 开发模式卡片：静态卡不加 hover 伪装（2026-10-23 Task 7）。 */
    .dev-mode-section { display: none; }
    .dev-mode-section.visible { display: block; }
    /* 分隔条 */
    .login-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #E5E7EB, transparent);
    }
    /* 偏好减少动画 */
    @media (prefers-reduced-motion: reduce) {
      .login-card-anim, .login-card-anim-delay-1, .login-card-anim-delay-2 {
        animation: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <a href="#main-content" class="visually-hidden skip-link">跳到主要内容</a>
  <div class="w-full max-w-md" id="main-content">
    <!-- 顶部签名区：红色色带 + 党徽 + 标题 -->
    <div class="login-hero login-card-anim rounded-t-2xl px-6 py-8 text-center">
      <img src="./assets/images/party_emblem.png" alt="党徽" class="login-hero-emblem mx-auto mb-3" style="width:56px;height:56px;" draggable="false">
      <h1 class="font-title text-lg font-bold text-white mb-1 tracking-wide">光华管理学院本科生党支部</h1>
    </div>

    <!-- 默认模式: 统一身份认证（IAAA）＋ 账号密码 -->
    <div id="login-default" class="login-card-anim login-card-anim-delay-1 bg-white rounded-b-2xl shadow-sm border border-t-0 border-gray-200 p-6">
      <h2 class="font-title text-base font-semibold text-gray-800 mb-1">登录</h2>
      <p class="text-xs text-gray-500 mb-4">请选择登录方式</p>
      <!-- 统一身份认证（北大 IAAA）· 批次 277：正式登录方式（备案未完成时按钮会给出可懂提示） -->
      <button type="button" id="iaaa-login" class="btn-accent w-full">统一身份认证登录</button>
      <p class="text-xs text-gray-500 mt-2 leading-relaxed">首次登录自动建号，选择支部后由支部确认。</p>
      <p id="iaaa-note" class="text-xs text-red-600 mt-2 leading-relaxed hidden"></p>
      <div class="login-divider my-5"></div>
      <p class="text-xs text-gray-500 mb-3">账号（学号 ＋ 密码）</p>
      <form id="login-form" class="space-y-4" novalidate>
        <div>
          <label for="student-id" class="block text-xs font-medium text-gray-600 mb-1.5">学号</label>
          <input type="text" id="student-id" name="studentId" inputmode="numeric" class="input-flat w-full" placeholder="请输入学号…" autocomplete="username">
        </div>
        <div>
          <label for="password" class="block text-xs font-medium text-gray-600 mb-1.5">密码</label>
          <input type="password" id="password" name="password" class="input-flat w-full" placeholder="请输入密码…" autocomplete="current-password">
        </div>
        <p id="login-error" class="text-xs text-red-600 hidden" role="alert">学号或密码错误，请重试</p>
        <button type="submit" class="btn-outline w-full">登录</button>
      </form>
      <div class="login-divider my-5"></div>
    </div>

    <!-- 开发模式（#login-dev ＋ #dev-toggle）由 login-entry.js 条件挂载：
         仅 `?dev=1` 或本机（localhost / 127.0.0.1）渲染；生产不渲染该区块（不是 display:none）。 -->

    <!-- 选支部（IAAA 入站「待归属」）· 批次 277：由本面板承接，**不新开页面**
         （与 #login-dev 同为「登录页内的一种模式」，复用 .dev-mode-section 的显隐类） -->
    <div id="login-branch" class="dev-mode-section login-card-anim login-card-anim-delay-1 bg-white rounded-b-2xl shadow-sm border border-t-0 border-gray-200 p-6">
      <h2 class="font-title text-base font-semibold text-gray-800 mb-1">选择支部</h2>
      <p class="text-xs text-gray-500 mb-4">选择你所属的支部并提交；提交后需由支部确认，确认前看不到支部内容。</p>
      <div id="branch-list" class="space-y-2"></div>
      <p id="branch-note" class="text-xs mt-3 leading-relaxed"></p>
      <button type="button" id="branch-refresh" class="btn-outline w-full mt-3">刷新确认状态</button>
    </div>

    <!-- 返回主页（T-284：登录页跳转闭环，避免误入后无出口） -->
    <div id="login-footer" class="text-center mt-3">
      <a href="./index.html" class="text-xs text-gray-500 hover:text-gray-600 transition-colors">← 返回主页</a>
    </div>
  </div>

</body>
</html>
