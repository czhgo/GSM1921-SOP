<!doctype html>
<html lang="zh-CN">
  <head>
    <base href="../">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>书记工作台 — 党建工作台</title>
    <meta
      name="description"
      content="党建工作台 — 活动日历 · 专班管理 · 任务分配"
    />
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/notosanssc/v36/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYxNbPzS5HE.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              party: {
                DEFAULT: "#CE1126",
                red: "#CE1126",
                gold: "#D4AF37",
                "gold-light": "#F5DEB3",
                50: "#FEF2F2",
                100: "#FEE2E2",
                200: "#FECACA",
                300: "#FCA5A5",
                400: "#F87171",
                500: "#EF4444",
                600: "#DC2626",
                700: "#CE1126",
                800: "#9B0000",
                900: "#7A0010",
                950: "#4A000A",
              },
              primary: {
                50: "#FEF2F2",
                100: "#FEE2E2",
                200: "#FECACA",
                300: "#FCA5A5",
                400: "#F87171",
                500: "#EF4444",
                600: "#DC2626",
                700: "#CE1126",
                800: "#9B0000",
                900: "#7A0010",
                950: "#4A000A",
              },
              accent: {
                gold: "#D4AF37",
                "gold-light": "#F5DEB3",
                amber: "#D97706",
                blue: "#3B82F6",
                emerald: "#10B981",
                violet: "#8B5CF6",
              },
              neutral: {
                0: "#FFFFFF",
                50: "#F8F9FA",
                100: "#F3F4F6",
                200: "#E5E7EB",
                300: "#D1D5DB",
                400: "#9CA3AF",
                500: "#6B7280",
                600: "#4B5563",
                700: "#374151",
                800: "#1F2937",
                900: "#111827",
              },
              surface: {
                page: "#F8F9FA",
                card: "#FFFFFF",
                elevated: "#FFFFFF",
                header: "#7A0010",
                sidebar: "#FFFFFF",
                hover: "#F3F4F6",
                active: "#FEE2E2",
              },
            },
            fontFamily: {
              sans: [
                "Noto Sans SC",
                "-apple-system",
                "PingFang SC",
                "Microsoft YaHei",
                "sans-serif",
              ],
              serif: ["Noto Serif SC", "STKaiti", "KaiTi", "serif"],
              title: [
                "STZhongsong",
                "华文中宋",
                "Noto Serif SC",
                "STSong",
                "SimSun",
                "serif",
              ],
              "title-en": ["Times New Roman", "Georgia", "serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header id="app-header"></header>
    <div id="sidebar-overlay"></div>
    <aside id="app-sidebar" class="sidebar-collapsed"></aside>
    <div class="sidebar-main-content pt-16 min-h-screen">
      <main class="flex-1 px-4 py-6 md:px-8">
        <div class="max-w-6xl mx-auto">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h2 class="font-title-cn text-xl font-bold text-gray-800">书记工作台</h2>
              <p class="text-xs text-gray-500 mt-1">组织统筹 · 赋权管理 · 全局决策</p>
            </div>
            <a href="./index.html" class="text-xs text-blue-600 hover:text-blue-800">← 返回主页</a>
          </div>
          <!-- Tab Bar + 工具栏 -->
          <div class="flex gap-2 mb-4 items-center flex-wrap">
            <button class="sec-tab-btn tab-btn-active px-4 py-2 text-xs font-medium rounded-lg transition-colors"
                    style="--tab-accent:#B91C1C;--tab-accent-bg:rgba(185,28,28,0.10);--tab-accent-border:rgba(185,28,28,0.25)"
                    data-sec-tab="calendar">日历总览</button>
            <button class="sec-tab-btn px-4 py-2 text-xs font-medium rounded-lg transition-colors"
                    data-sec-tab="query">活动查询</button>
            <button class="sec-tab-btn px-4 py-2 text-xs font-medium rounded-lg transition-colors"
                    data-sec-tab="write">活动写入</button>
            <button class="sec-tab-btn px-4 py-2 text-xs font-medium rounded-lg transition-colors"
                    data-sec-tab="assign">赋权管理</button>
            <button class="sec-tab-btn px-4 py-2 text-xs font-medium rounded-lg transition-colors"
                    data-sec-tab="feedback">issue 管理</button>
            <div class="ml-auto flex items-center gap-2" id="sec-toolbar"></div>
          </div>

          <!-- Tab: 日历总览 -->
          <div id="sec-tab-calendar" class="sec-tab-pane">
            <div id="secretary-stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>
            <div class="card rounded-2xl p-6 mb-6">
              <h3 class="font-title-cn text-base font-semibold text-gray-800 mb-4">活动日历</h3>
              <div id="calendar-view-section" class="grid lg:grid-cols-3 gap-4">
                <div class="lg:col-span-2">
                  <select id="month-selector" class="input-flat text-xs mb-3"></select>
                  <div id="cal-main-grid"></div>
                  <div id="calendar-legend" class="mt-3"></div>
                </div>
                <div id="inspector-container">
                  <div id="inspector-default" class="text-sm text-gray-400 text-center py-8">点击日期查看活动详情</div>
                  <div id="inspector-content" class="hidden"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Tab: 活动查询 -->
          <div id="sec-tab-query" class="sec-tab-pane hidden">
            <div class="card rounded-xl p-6">
              <h3 class="font-title-cn text-base font-semibold text-gray-800 mb-4">活动查询</h3>
              <div id="secretary-query-container"></div>
            </div>
          </div>

          <!-- Tab: 活动写入 -->
          <div id="sec-tab-write" class="sec-tab-pane hidden">
            <div class="card rounded-2xl p-6">
              <h3 class="font-title-cn text-base font-semibold text-gray-800 mb-4">活动写入</h3>
              <div id="write-form-area"></div>
            </div>
          </div>

          <!-- Tab: 赋权管理 -->
          <div id="sec-tab-assign" class="sec-tab-pane hidden">
            <div class="card rounded-2xl p-6">
              <h3 class="font-title-cn text-base font-semibold text-gray-800 mb-4">赋权管理</h3>
              <div id="assign-area"></div>
            </div>
          </div>

          <!-- Tab: issue 管理 -->
          <div id="sec-tab-feedback" class="sec-tab-pane hidden">
            <div class="card rounded-2xl p-6">
              <h3 class="font-title-cn text-base font-semibold text-gray-800 mb-4">issue 管理</h3>
              <p class="text-xs text-gray-500 mb-4">开源讨论集思广益；书记保留处置权（审核/状态/隐藏/合并）</p>

              <!-- 草稿审核区 -->
              <div class="mb-6">
                <h4 class="font-title-cn text-sm font-semibold text-gray-700 mb-3">待审核草稿</h4>
                <div id="issue-drafts-list" class="space-y-2"></div>
              </div>

              <!-- 全部 issue -->
              <div class="mb-4">
                <h4 class="font-title-cn text-sm font-semibold text-gray-700 mb-3">全部 issue</h4>
                <div id="issue-secretary-list" class="space-y-2"></div>
              </div>

              <!-- 工具区 -->
              <div class="pt-3 border-t border-gray-100 text-right space-x-2">
                <button id="btn-export-issues-json" class="text-[10px] px-2 py-1 rounded bg-white border border-gray-200 text-gray-600 hover:bg-gray-50">导出 issues.json</button>
                <button id="btn-clear-issue-cache" class="text-[10px] px-2 py-1 rounded bg-white border border-red-200 text-red-600 hover:bg-red-50">清除缓存</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./src/entries/ws-secretary-entry.js"></script>
  </body>
</html>
